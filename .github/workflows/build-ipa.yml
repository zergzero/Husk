          IGxpYnJhcnkgdGhhdCBsb2FkZWQgYnV0IGJvdW5kIG5vdGhpbmcuICovCisgICAgdGxfbG9nX2xpbmUoImpuaTogUmVnaXN0ZXJO
          YXRpdmVzICVzOiAlZCBtZXRob2QocykiLCBnaXZlbi0+bmFtZSwgKGludCluKTsKICAgICBwdGhyZWFkX211dGV4X3VubG9jaygm
          Z19sb2NrKTsKICAgICBfX2F0b21pY19hZGRfZmV0Y2goJmdfbmF0aXZlc19nZW5lcmF0aW9uLCAxLCBfX0FUT01JQ19SRUxFQVNF
