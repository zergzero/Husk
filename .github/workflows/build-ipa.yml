name: Build Husk IPA (3.4 + bq.log fix)

# Fork -> Actions -> "Build Husk IPA (3.4 + bq.log fix)" -> Run workflow.
# The artifact is an unsigned IPA; sign it yourself (SideStore/AltStore/Sideloadly).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner: macos-26 (reliable) or macos-15 (Xcode 16.4, often queued)"
        required: false
        default: "macos-26"

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    steps:
      # The fork itself, always readable with the job's own token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Tags are not copied into forks, and the job token cannot read another repository,
      # so 3.4 comes from upstream with an anonymous fetch (public repo).
      - name: Check out Husk 3.4 from upstream
        run: |
          set -euxo pipefail
          git fetch --depth 1 https://github.com/Leviidev/Husk.git refs/tags/3.4:refs/tags/3.4
          git checkout -q 3.4
          git log -1 --oneline
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

