      # Xcode 26 marks SwiftUI's ToolbarContentBuilder.buildIf as iOS 16+, and the app targets
      # iOS 15.5, so ProfileView.swift fails to compile. Xcode 16's SDK does not, but macos-15
      # runners queue for a long time; skip availability diagnostics instead, keeping 15.5.
      - name: Build settings for Xcode 26
        run: |
          set -euxo pipefail
          xcodebuild -version
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("src/app/project.yml")
          s = p.read_text()
          if "OTHER_SWIFT_FLAGS" not in s:
              s = s.replace('    SWIFT_VERSION: "5.0"',
                            '    SWIFT_VERSION: "5.0"\n    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-availability-checking"', 1)
              p.write_text(s)
          PY
          grep -n "OTHER_SWIFT_FLAGS" src/app/project.yml

      # libhuskps4.dylib is the PS4 layer, built from Bachata-S4 and husk-fex checkouts that are not in
      # this repository, so ci_build.sh cannot produce it. Drop its project entry (3 comment lines, the
      # framework line, and its 3 options) and the packaging check: the app already handles its absence
      # ("This copy of Husk doesn't have the PS4 layer"); Android apps do not use it.
      - name: Drop the PS4 layer
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("src/app/project.yml")
          lines = p.read_text().splitlines(True)
          i = next(i for i, l in enumerate(lines) if "libhuskps4.dylib" in l)
          del lines[i - 3:i + 4]
          p.write_text("".join(lines))
          q = pathlib.Path("scripts/package_ipa.sh")
          t = q.read_text()
          q.write_text(t.replace("libqemu-aarch64-softmmu.dylib libANGLE-shared.dylib libhuskps4.dylib",
                                 "libqemu-aarch64-softmmu.dylib libANGLE-shared.dylib"))
          PY
          grep -c libhuskps4 src/app/project.yml scripts/package_ipa.sh || true

      - name: Free disk space
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          df -h /

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen ccache cmake qemu
          python3 -m pip install --break-system-packages pyyaml || python3 -m pip install --user pyyaml
          rustup target add aarch64-apple-ios

      # The Dalvik runtime's boot class path (libcore, ICU, husk-framework.dex, framework-res) is
      # built by scripts/build_java_runtime.sh from a LineageOS APEX tree that is not in this
      # repository, so the app would start without it ("dvm: no java/lang/Object on the boot class
      # path"). The official 3.4 IPA carries exactly that folder; take it from there.
      - name: Get the Java runtime from the official 3.4 IPA
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/Husk-3.4.ipa" https://github.com/Leviidev/Husk/releases/download/3.4/Husk.ipa
          unzip -q "$RUNNER_TEMP/Husk-3.4.ipa" -d "$RUNNER_TEMP/husk-release"
          JRT="$RUNNER_TEMP/husk-release/Payload/Husk.app/java-runtime"
          test -f "$JRT/husk-framework.dex"
          mkdir -p build/java-runtime
          cp -R "$JRT/." build/java-runtime/
          du -sh build/java-runtime
          cp "$RUNNER_TEMP/husk-release/Payload/Husk.app/cacert.pem" build/java-runtime/cacert.pem

      # Android's Java trust store: husk-tl-bionic-io.c maps /system/etc/security/cacerts to the
      # runtime's cacerts/ folder, with Android's hashed file names (subject_hash_old + ".0").
      - name: Build the Java trust store
        run: |
          set -euxo pipefail
          mkdir -p build/java-runtime/cacerts
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          pem = pathlib.Path("build/java-runtime/cacert.pem").read_text()
          certs = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", pem, re.S)
          out = pathlib.Path("build/java-runtime/cacerts")
          for cert in certs:
              f = tempfile.NamedTemporaryFile("w", suffix=".pem", delete=False)
              f.write(cert)
              f.close()
              h = subprocess.check_output(["openssl", "x509", "-subject_hash_old", "-in", f.name, "-noout"]).decode().strip()
              (out / (h + ".0")).write_text(cert)
          print("trusted roots:", len(certs))
          PY
          ls build/java-runtime/cacerts | wc -l

      - name: Build (takes a while)
        run: |
          set -o pipefail
          ./scripts/ci_build.sh build/Husk.ipa 2>&1 | tee build-output.log

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-logs
          path: |
            build-output.log
            build/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Husk-ipa-3.4
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: warn
          retention-days: 7
